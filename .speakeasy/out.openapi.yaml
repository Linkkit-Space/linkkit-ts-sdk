      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [links]
              properties:
                links:
                  type: array
                  maxItems: 1000
                  items:
                    type: object
                    required: [original_url]
                    properties:
                      original_url:
                        type: string
                        format: uri
                      title:
                        type: string
                        nullable: true
                      notes:
                        type: string
                        nullable: true
                      custom_domain:
                        type: string
                        nullable: true
      responses:
        '201':
          description: Bulk result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkCreateResult'
        '400':
          description: links array missing or empty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Plan limit would be exceeded
          content:
