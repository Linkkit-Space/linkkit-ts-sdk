  # ── Tracking (public) ──────────────────────────────────────────────────────
  /track/lead:
    post:
      tags: [Tracking]
      summary: Track a lead
      description: |
        Records a lead conversion event. Authenticated via a publishable key (not an API key).
        Pass `lkclid` (the Linkkit click ID from the `?lkclid=` query parameter appended to your
        short link) to attribute the lead to a specific click.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [publishable_key, customer_external_id]
              properties:
                publishable_key:
                  type: string
                  description: Your Linkkit publishable key (starts with `pk_`)
                  example: pk_live_abc123
                lkclid:
                  type: string
                  format: uuid
                  description: Linkkit click ID for attribution (optional)
                  nullable: true
                customer_external_id:
                  type: string
                  description: Your internal identifier for this customer
                  example: cus_123
                event_name:
                  type: string
                  description: Custom event name (defaults to "Lead")
                  example: Trial Started
                customer_name:
                  type: string
                  nullable: true
                customer_email:
                  type: string
                  format: email
                  nullable: true
                metadata:
                  type: object
                  nullable: true
                  additionalProperties: true
      responses:
        '201':
          description: Lead recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversion'
        '400':
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid or unauthorized publishable key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-speakeasy-name-override: lead
  /track/sale:
    post:
      tags: [Tracking]
      summary: Track a sale
      description: |
        Records a sale conversion event. Authenticated via a publishable key (not an API key).
        Pass `lkclid` (the Linkkit click ID) to attribute the sale to a specific click.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [publishable_key, customer_external_id, amount]
              properties:
                publishable_key:
                  type: string
                  description: Your Linkkit publishable key (starts with `pk_`)
                  example: pk_live_abc123
                lkclid:
                  type: string
                  format: uuid
                  description: Linkkit click ID for attribution (optional)
                  nullable: true
                customer_external_id:
                  type: string
                  description: Your internal identifier for this customer
                  example: cus_123
                customer_name:
                  type: string
                  nullable: true
                customer_email:
                  type: string
                  format: email
                  nullable: true
                amount:
                  type: integer
                  description: Sale amount in cents
                  example: 4999
                currency:
                  type: string
                  description: ISO 4217 currency code (defaults to "usd")
                  example: usd
                payment_processor:
                  type: string
                  nullable: true
                  example: stripe
                invoice_id:
                  type: string
                  nullable: true
                  example: inv_abc123
                metadata:
                  type: object
                  nullable: true
                  additionalProperties: true
      responses:
